
[project]
name = "onnx-phonics"
description = "Messing around with ONNX models"
version = "0.3.0"
readme = "README.md"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
requires-python = "<4.0,>=3.12"
dependencies = ["onnx<2.0.0,>=1.15.0"]

[dependency-groups]
dev = ["mypy>=1.8.0", "ruff>=0.2.2", "pytest>=8.0.1", "pyright>=1.1.400"]

[project.scripts]
squat-model = "onnx_phonics.squat_model:main"

[tool.pdm.build]
includes = ["onnx_phonics"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
